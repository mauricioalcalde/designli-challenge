# openspec/config.yaml
schema: spec-driven

context: |
  Project: designli-challenge
  Monorepo: pnpm 11.4 with apps/api (NestJS 10 + Prisma + SQLite), apps/mobile (Expo 52 + RN 0.76 + Zustand + MMKV), packages/shared (types).
  Architecture: SOLID, Clean/Hexagonal, Screaming Architecture, atomic design.
  Backend: Controllers → Services → Providers pattern with NestJS DI. Prisma ORM with SQLite.
  Mobile: Feature-based directory layout (auth, alerts, stocks, notifications). Zustand stores + API client layer.
  Testing: vitest 3 (API, ~50 tests), jest 29 + RNTL (mobile, ~114 tests). strict_tdd=true.
  Style: Conventional Commits, work-unit commits, chained PRs for >400-line changes.
  Workflow: SDD-driven, agentic but human-directed.
  CI: GitHub Actions (lint + test-api + test-mobile on push/PR to main).
  Docs: Cognitive-load-reduced, progressive disclosure.

strict_tdd: true

testing:
  runner: vitest (api), jest (mobile)
  layers:
    unit: true
    integration: true
    e2e: false
  coverage: true
  quality:
    linter: true
    type_checker: true
    formatter: true
  notes: >
    Full testing infrastructure in place:
    - API: vitest 3 with @nestjs/testing + supertest for integration tests
    - Mobile: jest 29 + jest-expo + @testing-library/react-native
    - Coverage available via --coverage flags but not explicitly configured
    - ESLint 8.57 + Prettier 3.4 + Husky/lint-staged for code quality
    - CI runs test suites on push/PR via GitHub Actions

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the relevant Clean Architecture layer (domain, application, infrastructure, presentation)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Tag specs with domain layer
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale (ADR)
    - Enforce layer boundaries: domain MUST NOT depend on infrastructure
  tasks:
    - Group by architectural layer, use hierarchical numbering
    - Keep tasks completable in one session
    - Map each task to test-first step when strict_tdd is enabled
  apply:
    tdd: true
    test_command: 'pnpm test'
  verify:
    test_command: 'pnpm test'
    build_command: 'pnpm build:api && pnpm typecheck'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
